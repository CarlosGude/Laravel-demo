name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PHP_VERSION: '8.4'
  PHP_EXTENSIONS: mbstring, bcmath, intl, zip, gd, exif, pcntl, pdo_sqlite, redis

jobs:
  tests:
    name: Tests (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Verify PHP patch version (CVE-2026-109618 / CVE-2026-109619)
        run: php -r 'exit(version_compare(PHP_VERSION, "8.4.27", ">=") ? 0 : 1);' || { echo "PHP $(php -r 'echo PHP_VERSION;') is below the patched 8.4.27 baseline"; exit 1; }

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run test suite
        run: composer test

  static-analysis:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Verify PHP patch version (CVE-2026-109618 / CVE-2026-109619)
        run: php -r 'exit(version_compare(PHP_VERSION, "8.4.27", ">=") ? 0 : 1);' || { echo "PHP $(php -r 'echo PHP_VERSION;') is below the patched 8.4.27 baseline"; exit 1; }

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run PHPStan / Larastan
        run: composer stan

  architecture:
    name: Architecture boundaries (Deptrac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Verify PHP patch version (CVE-2026-109618 / CVE-2026-109619)
        run: php -r 'exit(version_compare(PHP_VERSION, "8.4.27", ">=") ? 0 : 1);' || { echo "PHP $(php -r 'echo PHP_VERSION;') is below the patched 8.4.27 baseline"; exit 1; }

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Deptrac
        run: composer deptrac

  code-style:
    name: Code style (PHP CS Fixer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Verify PHP patch version (CVE-2026-109618 / CVE-2026-109619)
        run: php -r 'exit(version_compare(PHP_VERSION, "8.4.27", ">=") ? 0 : 1);' || { echo "PHP $(php -r 'echo PHP_VERSION;') is below the patched 8.4.27 baseline"; exit 1; }

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP CS Fixer
        run: composer cs
